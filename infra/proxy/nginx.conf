worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format proxy '$remote_addr - $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout proxy;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map "$request_method:$uri:$ssl_client_verify" $visiox_management_proxy_auth_token {
        default "";
        "POST:/agent/v1/enrollment-tokens:SUCCESS" "${VISIOX_MANAGEMENT_PROXY_AUTH_TOKEN}";
        "GET:/nodes:SUCCESS" "${VISIOX_MANAGEMENT_PROXY_AUTH_TOKEN}";
        ~^GET:/nodes/[^/]+:SUCCESS$ "${VISIOX_MANAGEMENT_PROXY_AUTH_TOKEN}";
        ~^POST:/nodes/[^/]+/drain:SUCCESS$ "${VISIOX_MANAGEMENT_PROXY_AUTH_TOKEN}";
        "GET:/resource-pools:SUCCESS" "${VISIOX_MANAGEMENT_PROXY_AUTH_TOKEN}";
    }

    upstream api_service_upstream {
        server api-service:8000;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_client_certificate /etc/nginx/mtls/operator-ca.crt;
        ssl_verify_client optional;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        server_tokens off;
        client_max_body_size 2m;
        client_body_timeout 15s;
        keepalive_timeout 65s;
        send_timeout 60s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-SSL-Client-Verify '';
        proxy_set_header X-SSL-Client-DN '';
        proxy_set_header X-Visiox-Management-Proxy-Token $visiox_management_proxy_auth_token;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location = /agent/v1/enrollment-tokens {
            if ($request_method != POST) { return 405; }
            if ($ssl_client_verify != SUCCESS) { return 403; }
            proxy_pass http://api_service_upstream;
        }

        location = /nodes {
            if ($request_method != GET) { return 405; }
            if ($ssl_client_verify != SUCCESS) { return 403; }
            proxy_pass http://api_service_upstream;
        }

        location ~ ^/nodes/[^/]+$ {
            if ($request_method != GET) { return 405; }
            if ($ssl_client_verify != SUCCESS) { return 403; }
            proxy_pass http://api_service_upstream;
        }

        location ~ ^/nodes/[^/]+/drain$ {
            if ($request_method != POST) { return 405; }
            if ($ssl_client_verify != SUCCESS) { return 403; }
            proxy_pass http://api_service_upstream;
        }

        location = /resource-pools {
            if ($request_method != GET) { return 405; }
            if ($ssl_client_verify != SUCCESS) { return 403; }
            proxy_pass http://api_service_upstream;
        }

        location = /agent/v1/enroll {
            if ($request_method != POST) { return 405; }
            proxy_pass http://api_service_upstream;
        }

        location = /agent/v1/connect {
            if ($request_method != GET) { return 405; }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-SSL-Client-Verify '';
            proxy_set_header X-SSL-Client-DN '';
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_pass http://api_service_upstream;
        }

        location / {
            return 403;
        }
    }
}
