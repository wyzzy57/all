services:
  api-service:
    build:
      context: ../..
      dockerfile: apps/api-service/Dockerfile
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      registry:
        condition: service_started
      label-studio:
        condition: service_started
    environment:
      VISIOX_TRAINING_RUNS_ROOT: /workspace/training-runs
    volumes:
      - training-runs:/workspace/training-runs:ro

  label-sync-worker:
    build:
      context: ../..
      dockerfile: apps/api-service/Dockerfile
    env_file:
      - ../../.env
    command:
      - python
      - -m
      - visiox_label_sync_worker.runner
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      label-studio:
        condition: service_started

  training-worker:
    build:
      context: ../..
      dockerfile: apps/api-service/Dockerfile
    env_file:
      - ../../.env
    command:
      - python
      - -m
      - visiox_training_worker.runner
      - --work-dir
      - /workspace/training-runs
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      mlflow:
        condition: service_started
      tensorboard:
        condition: service_started
    environment:
      MLFLOW_TRACKING_URI: ${VISIOX_MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: Visiox YOLO26
      VISIOX_TENSORBOARD_HISTOGRAM_INTERVAL: ${VISIOX_TENSORBOARD_HISTOGRAM_INTERVAL:-5}
    volumes:
      - training-runs:/workspace/training-runs

  mlflow:
    build:
      context: ../..
      dockerfile: infra/observability/Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - mlflow,mlflow:5000,localhost,localhost:5001,127.0.0.1,127.0.0.1:5001
      - --cors-allowed-origins
      - http://127.0.0.1:5174,http://localhost:5174
      - --x-frame-options
      - NONE
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow

  tensorboard:
    build:
      context: ../..
      dockerfile: infra/observability/Dockerfile
    command:
      - tensorboard
      - --logdir
      - /workspace/training-runs/runs
      - --host
      - 0.0.0.0
      - --port
      - "6006"
      - --reload_interval
      - "2"
    ports:
      - "6006:6006"
    volumes:
      - training-runs:/workspace/training-runs:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visiox}
      POSTGRES_USER: ${POSTGRES_USER:-visiox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiox}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visiox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-visiox123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  label-studio:
    image: heartexlabs/label-studio:latest
    command:
      - label-studio
      - start
      - --host
      - http://10.10.40.2:8080
      - --username
      - ${LABEL_STUDIO_USERNAME:-admin@example.com}
      - --password
      - ${LABEL_STUDIO_PASSWORD:-visiox123}
      - --user-token
      - ${LABEL_STUDIO_USER_TOKEN:-visiox-label-studio-token}
      - --enable-legacy-api-token
    environment:
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: ${LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK:-true}
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-admin@example.com}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:-visiox123}
      LABEL_STUDIO_USER_TOKEN: ${LABEL_STUDIO_USER_TOKEN:-visiox-label-studio-token}
    ports:
      - "8080:8080"
    volumes:
      - label-studio-data:/label-studio/data

volumes:
  postgres-data:
  minio-data:
  registry-data:
  label-studio-data:
  training-runs:
  mlflow-data:
