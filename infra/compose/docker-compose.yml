services:
  ownership-backfill:
    build:
      context: ../..
      dockerfile: apps/api-service/Dockerfile
    env_file:
      - ../../.env
    command:
      - python
      - -m
      - visiox_api.maintenance.backfill_resource_ownership
    depends_on:
      api-service:
        condition: service_started
    profiles: ["maintenance"]

  api-service:
    build:
      context: ../..
      dockerfile: apps/api-service/Dockerfile
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      registry:
        condition: service_started
      label-studio:
        condition: service_started
    environment:
      VISIOX_TRAINING_RUNS_ROOT: /workspace/training-runs
      VISIOX_AUTH_JWT_SECRET_FILE: /run/secrets/visiox_auth_jwt_secret
      VISIOX_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/visiox_bootstrap_admin_password
      VISIOX_AUTH_COOKIE_SECURE: ${VISIOX_AUTH_COOKIE_SECURE:-false}
      VISIOX_AGENT_GATEWAY_ENABLED: "true"
      VISIOX_AGENT_AUTO_GENERATE_CA: "true"
      VISIOX_AGENT_PUBLIC_WS_URL: ${VISIOX_AGENT_PUBLIC_WS_URL:-ws://host.docker.internal:8000/agent/v1/connect}
      VISIOX_EDGE_BOOTSTRAP_SOCKET: /run/visiox-edge/edge-bootstrap.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - training-runs:/workspace/training-runs:ro
      - agent-pki:/var/lib/visiox/pki
      - edge-runtime:/run/visiox-edge
    secrets:
      - source: visiox_auth_jwt_secret
        target: visiox_auth_jwt_secret
        mode: 0400
      - source: visiox_bootstrap_admin_password
        target: visiox_bootstrap_admin_password
        mode: 0400
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  edge-executor-worker:
    build:
      context: ../..
      dockerfile: apps/api-service/Dockerfile
    env_file:
      - ../../.env
    command:
      - python
      - -m
      - visiox_edge_executor_worker.runner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      VISIOX_EDGE_BOOTSTRAP_SOCKET: /run/visiox-edge/edge-bootstrap.sock
      VISIOX_EDGE_CREDENTIAL_MASTER_KEY_FILE: /run/secrets/edge_credential_master_key
      VISIOX_TRAINING_RUNS_ROOT: /workspace/training-runs
    volumes:
      - edge-runtime:/run/visiox-edge
      - training-runs:/workspace/training-runs
      - ../../workers/edge-executor-worker/remote:/app/workers/edge-executor-worker/remote:ro
    secrets:
      - source: edge_credential_master_key
        target: edge_credential_master_key
        mode: 0400
    deploy:
      replicas: 1

  label-sync-worker:
    build:
      context: ../..
      dockerfile: apps/api-service/Dockerfile
    env_file:
      - ../../.env
    command:
      - python
      - -m
      - visiox_label_sync_worker.runner
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      label-studio:
        condition: service_started

  training-worker:
    build:
      context: ../..
      dockerfile: apps/api-service/Dockerfile
    env_file:
      - ../../.env
    command:
      - python
      - -m
      - visiox_training_worker.runner
      - --work-dir
      - /workspace/training-runs
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      mlflow:
        condition: service_started
      tensorboard:
        condition: service_started
    environment:
      MLFLOW_TRACKING_URI: ${VISIOX_MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: Visiox YOLO26
      VISIOX_TENSORBOARD_HISTOGRAM_INTERVAL: ${VISIOX_TENSORBOARD_HISTOGRAM_INTERVAL:-5}
    volumes:
      - training-runs:/workspace/training-runs

  mlflow:
    build:
      context: ../..
      dockerfile: infra/observability/Dockerfile
    env_file:
      - ../../.env
    command:
      - /bin/sh
      - -ec
      - >-
        exec mlflow server --host 0.0.0.0 --port 5000
        --allowed-hosts "$${VISIOX_MLFLOW_ALLOWED_HOSTS:-mlflow,mlflow:5000,localhost,localhost:5001,127.0.0.1,127.0.0.1:5001}"
        --cors-allowed-origins http://127.0.0.1:5174,http://localhost:5174
        --x-frame-options NONE --backend-store-uri sqlite:////mlflow/mlflow.db
        --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  tensorboard:
    build:
      context: ../..
      dockerfile: infra/observability/Dockerfile
    command:
      - tensorboard
      - --logdir
      - /workspace/training-runs/runs
      - --host
      - 0.0.0.0
      - --port
      - "6006"
      - --reload_interval
      - "2"
    ports:
      - "6006:6006"
    volumes:
      - training-runs:/workspace/training-runs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visiox}
      POSTGRES_USER: ${POSTGRES_USER:-visiox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiox}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visiox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-visiox123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  label-studio:
    image: heartexlabs/label-studio:latest
    command:
      - label-studio
      - start
      - --host
      - 0.0.0.0
      - --username
      - ${LABEL_STUDIO_USERNAME:-admin@example.com}
      - --password
      - ${LABEL_STUDIO_PASSWORD:-visiox123}
      - --user-token
      - ${LABEL_STUDIO_USER_TOKEN:-visiox-label-studio-token}
      - --enable-legacy-api-token
    environment:
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: ${LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK:-true}
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-admin@example.com}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:-visiox123}
      LABEL_STUDIO_USER_TOKEN: ${LABEL_STUDIO_USER_TOKEN:-visiox-label-studio-token}
    ports:
      - "8080:8080"
    volumes:
      - label-studio-data:/label-studio/data

  label-studio-gateway:
    build:
      context: ../..
      dockerfile: apps/label-studio-gateway/Dockerfile
    environment:
      LABEL_STUDIO_UPSTREAM: http://label-studio:8080
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-admin@example.com}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:-visiox123}
      VISIOX_API_INTERNAL_URL: http://api-service:8000
    depends_on:
      - label-studio
      - api-service
    ports:
      - "80:8081"

volumes:
  postgres-data:
  minio-data:
  registry-data:
  label-studio-data:
  training-runs:
  mlflow-data:
  agent-pki:
  edge-runtime:

secrets:
  edge_credential_master_key:
    file: ../../.local-secrets/edge_credential_master_key
  visiox_auth_jwt_secret:
    file: ../../.local-secrets/visiox_auth_jwt_secret
  visiox_bootstrap_admin_password:
    file: ../../.local-secrets/visiox_bootstrap_admin_password
