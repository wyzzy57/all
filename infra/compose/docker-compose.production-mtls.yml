services:
  api-service:
    ports: !reset []
    environment:
      VISIOX_ENV: production
      VISIOX_AGENT_AUTO_GENERATE_CA: "false"
      VISIOX_AGENT_CA_CERT_PATH: /run/secrets/agent_ca_certificate
      VISIOX_AGENT_CA_KEY_PATH: /run/secrets/agent_ca_private_key
      VISIOX_MANAGEMENT_PROXY_AUTH_TOKEN_FILE: /run/secrets/management_proxy_auth_token
      VISIOX_AGENT_PUBLIC_WS_URL: "${VISIOX_AGENT_PUBLIC_WS_URL:?VISIOX_AGENT_PUBLIC_WS_URL must be set to the public wss URL}"
    volumes: !reset
      - training-runs:/workspace/training-runs:ro
    secrets:
      - source: agent_ca_certificate
        target: agent_ca_certificate
        mode: 0444
      - source: agent_ca_private_key
        target: agent_ca_private_key
        mode: 0400
      - source: management_proxy_auth_token
        target: management_proxy_auth_token
        mode: 0444
    networks:
      api-dependencies:
      management-backend:

  label-sync-worker:
    networks:
      application-internal:

  training-worker:
    networks:
      application-internal:

  mlflow:
    ports: !reset []
    networks:
      application-internal:
      api-dependencies:

  tensorboard:
    ports: !reset []
    networks:
      application-internal:

  postgres:
    ports: !reset []
    networks:
      application-internal:
      api-dependencies:

  redis:
    ports: !reset []
    networks:
      application-internal:
      api-dependencies:

  minio:
    ports: !reset []
    networks:
      application-internal:
      api-dependencies:

  registry:
    ports: !reset []
    networks:
      application-internal:
      api-dependencies:

  label-studio:
    ports: !reset []
    networks:
      application-internal:
      api-dependencies:

  management-proxy:
    image: nginx:stable-alpine
    depends_on:
      api-service:
        condition: service_started
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/visiox-management-proxy-entrypoint.sh"]
    command: []
    ports:
      - "${VISIOX_MANAGEMENT_PROXY_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ../proxy/nginx.conf
        target: /etc/nginx/nginx.conf.template
        read_only: true
      - type: bind
        source: ../proxy/entrypoint.sh
        target: /usr/local/bin/visiox-management-proxy-entrypoint.sh
        read_only: true
      - type: bind
        source: "${VISIOX_MANAGEMENT_TLS_CERT_PATH:?VISIOX_MANAGEMENT_TLS_CERT_PATH is required}"
        target: /etc/nginx/tls/server.crt
        read_only: true
      - type: bind
        source: "${VISIOX_MANAGEMENT_TLS_KEY_PATH:?VISIOX_MANAGEMENT_TLS_KEY_PATH is required}"
        target: /etc/nginx/tls/server.key
        read_only: true
      - type: bind
        source: "${VISIOX_MANAGEMENT_OPERATOR_CA_PATH:?VISIOX_MANAGEMENT_OPERATOR_CA_PATH is required}"
        target: /etc/nginx/mtls/operator-ca.crt
        read_only: true
    networks:
      management-public:
      management-backend:
    secrets:
      - source: management_proxy_auth_token
        target: management_proxy_auth_token
        mode: 0444

networks:
  application-internal:
    internal: true
  api-dependencies:
    internal: true
  management-backend:
    internal: true
  management-public:

secrets:
  agent_ca_certificate:
    file: "${VISIOX_AGENT_CA_CERT_HOST_PATH:?VISIOX_AGENT_CA_CERT_HOST_PATH is required}"
  agent_ca_private_key:
    file: "${VISIOX_AGENT_CA_KEY_HOST_PATH:?VISIOX_AGENT_CA_KEY_HOST_PATH is required}"
  management_proxy_auth_token:
    file: "${VISIOX_MANAGEMENT_PROXY_AUTH_TOKEN_HOST_PATH:?VISIOX_MANAGEMENT_PROXY_AUTH_TOKEN_HOST_PATH is required}"
