services:
  api-service:
    image: python:3.12-alpine
    command: ["python", "/app/backend.py"]
    volumes:
      - type: bind
        source: ./backend.py
        target: /app/backend.py
        read_only: true
    networks:
      - api-dependencies
      - management-backend
    environment:
      VISIOX_TEST_PROXY_TOKEN_FILE: /run/secrets/management_proxy_auth_token
    secrets:
      - management_proxy_auth_token

  management-proxy:
    image: nginx:stable-alpine
    depends_on:
      - api-service
    ports:
      - "127.0.0.1::8443"
    entrypoint: ["/bin/sh", "/usr/local/bin/visiox-management-proxy-entrypoint.sh"]
    command: []
    volumes:
      - type: bind
        source: ../../../infra/proxy/nginx.conf
        target: /etc/nginx/nginx.conf.template
        read_only: true
      - type: bind
        source: ../../../infra/proxy/entrypoint.sh
        target: /usr/local/bin/visiox-management-proxy-entrypoint.sh
        read_only: true
      - type: bind
        source: ${VISIOX_MTLS_TEST_CERT_DIR}
        target: /etc/nginx/tls
        read_only: true
      - type: bind
        source: ${VISIOX_MTLS_TEST_CERT_DIR}
        target: /etc/nginx/mtls
        read_only: true
    networks:
      - public
      - management-backend
    secrets:
      - management_proxy_auth_token

  dependency-peer:
    image: python:3.12-alpine
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    networks:
      - api-dependencies

networks:
  public:
  api-dependencies:
    internal: true
  management-backend:
    internal: true

secrets:
  management_proxy_auth_token:
    file: ${VISIOX_MTLS_TEST_PROXY_TOKEN_PATH:?VISIOX_MTLS_TEST_PROXY_TOKEN_PATH is required}
