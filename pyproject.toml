[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "visiox"
version = "0.1.0"
description = "Private YOLO26 model management platform"
requires-python = ">=3.12"
dependencies = [
  "albumentations>=1.4,<2.0",
  "alembic>=1.13,<2.0",
  "cleanvision>=0.3,<0.4",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "minio>=7.2,<8.0",
  "pillow>=10.0,<12.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "ultralytics>=8.3,<9.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
]
dev = [
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api-service/src/visiox_api",
  "apps/yolo26-inference/src/visiox_yolo26_inference",
  "packages/visiox-common/src/visiox_common",
  "packages/visiox-db/src/visiox_db",
  "packages/visiox-messaging/src/visiox_messaging",
  "packages/visiox-storage/src/visiox_storage",
  "packages/visiox-yolo26/src/visiox_yolo26",
  "workers/label-sync-worker/src/visiox_label_sync_worker",
  "workers/training-worker/src/visiox_training_worker",
]

[tool.pytest.ini_options]
pythonpath = [
  "apps/api-service/src",
  "apps/yolo26-inference/src",
  "packages/visiox-common/src",
  "packages/visiox-db/src",
  "packages/visiox-messaging/src",
  "packages/visiox-storage/src",
  "packages/visiox-yolo26/src",
  "workers/label-sync-worker/src",
  "workers/training-worker/src",
]
testpaths = ["tests"]
