[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "visiox"
version = "0.1.0"
description = "Private YOLO26 model management platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "minio>=7.2,<8.0",
  "pydantic-settings>=2.4,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
]
dev = [
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api-service/src/visiox_api",
  "packages/visiox-common/src/visiox_common",
  "packages/visiox-db/src/visiox_db",
  "packages/visiox-messaging/src/visiox_messaging",
  "packages/visiox-storage/src/visiox_storage",
  "workers/model-worker/src/visiox_model_worker",
]

[tool.pytest.ini_options]
pythonpath = [
  "apps/api-service/src",
  "packages/visiox-common/src",
  "packages/visiox-db/src",
  "packages/visiox-messaging/src",
  "packages/visiox-storage/src",
  "workers/model-worker/src",
]
testpaths = ["tests"]
