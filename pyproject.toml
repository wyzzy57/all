[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "visiox"
version = "0.1.0"
description = "Private YOLO26 model management platform"
requires-python = ">=3.12"
dependencies = [
  "albumentations>=1.4,<2.0",
  "alembic>=1.17.1,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "cleanvision>=0.3,<0.4",
  "cryptography>=45,<47",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "minio>=7.2,<8.0",
  "mlflow>=3.0,<4.0",
  "packaging>=24,<27",
  "pillow>=10.0,<12.0",
  "paramiko>=3.5,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "psutil>=6.0,<8.0",
  "PyJWT>=2.9,<3.0",
  "pyyaml>=6.0,<7.0",
  "redis>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "tensorboard>=2.18,<3.0",
  "ultralytics>=8.3,<9.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
]
dev = [
  "ruff>=0.8,<1.0",
]

[project.scripts]
visiox-edge-bootstrap-server = "visiox_edge_executor_worker.bootstrap_server:main"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api-service/src/visiox_api",
  "apps/yolo26-inference/src/visiox_yolo26_inference",
  "packages/visiox-common/src/visiox_common",
  "packages/visiox-db/src/visiox_db",
  "packages/visiox-messaging/src/visiox_messaging",
  "packages/visiox-paddlex/src/visiox_paddlex",
  "packages/visiox-storage/src/visiox_storage",
  "packages/visiox-training/src/visiox_training",
  "packages/visiox-yolo26/src/visiox_yolo26",
  "workers/label-sync-worker/src/visiox_label_sync_worker",
  "workers/edge-executor-worker/src/visiox_edge_executor_worker",
  "workers/training-worker/src/visiox_training_worker",
  "workers/llm-training-worker/src/visiox_llm_training_worker",
  "workers/paddlex-training-worker/src/visiox_paddlex_training_worker",
]

[tool.hatch.build.targets.wheel.force-include]
"workers/edge-executor-worker/remote/probe_inventory.sh" = "visiox_edge_executor_worker/remote/probe_inventory.sh"
"workers/edge-executor-worker/remote/deploy_inference.sh" = "visiox_edge_executor_worker/remote/deploy_inference.sh"
"workers/edge-executor-worker/remote/inspect_deployment.sh" = "visiox_edge_executor_worker/remote/inspect_deployment.sh"
"workers/edge-executor-worker/remote/inspect_runtime.sh" = "visiox_edge_executor_worker/remote/inspect_runtime.sh"
"workers/edge-executor-worker/remote/stop_deployment.sh" = "visiox_edge_executor_worker/remote/stop_deployment.sh"
"workers/edge-executor-worker/remote/start_deployment.sh" = "visiox_edge_executor_worker/remote/start_deployment.sh"
"workers/edge-executor-worker/remote/stage_training.sh" = "visiox_edge_executor_worker/remote/stage_training.sh"
"workers/edge-executor-worker/remote/launch_rank.sh" = "visiox_edge_executor_worker/remote/launch_rank.sh"
"workers/edge-executor-worker/remote/stop_training.sh" = "visiox_edge_executor_worker/remote/stop_training.sh"

[tool.pytest.ini_options]
pythonpath = [
  "apps/api-service/src",
  "apps/yolo26-inference/src",
  "packages/visiox-common/src",
  "packages/visiox-db/src",
  "packages/visiox-messaging/src",
  "packages/visiox-paddlex/src",
  "packages/visiox-storage/src",
  "packages/visiox-training/src",
  "packages/visiox-yolo26/src",
  "workers/label-sync-worker/src",
  "workers/edge-executor-worker/src",
  "workers/training-worker/src",
  "workers/llm-training-worker/src",
  "workers/paddlex-training-worker/src",
]
testpaths = ["tests"]
